<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Inventory</h1>
    <nav aria-label="Views">
      <button class="tab" data-view="products" aria-current="page">Products</button>
      <button class="tab" data-view="low-stock">Low stock</button>
      <button class="tab" data-view="summary">Summary</button>
    </nav>
  </header>

  <main>
    <section id="products">
      <div class="section-head">
        <h2>Products <span id="product-total" class="muted"></span></h2>
        <button id="add-product" class="primary">Add product</button>
      </div>

      <form id="filters" class="filters">
        <input name="search" type="search" placeholder="Search name, SKU or supplier" aria-label="Search">
        <select name="category" aria-label="Category"><option value="">All categories</option></select>
        <select name="stock" aria-label="Stock status">
          <option value="">All stock</option>
          <option value="in">In stock</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
        <input name="minPrice" type="number" min="0" placeholder="Min ₹" aria-label="Minimum price">
        <input name="maxPrice" type="number" min="0" placeholder="Max ₹" aria-label="Maximum price">
        <select name="sort" aria-label="Sort">
          <option value="-createdAt">Newest</option>
          <option value="name">Name A–Z</option>
          <option value="price">Price: low to high</option>
          <option value="-price">Price: high to low</option>
          <option value="quantity">Quantity: low to high</option>
          <option value="-quantity">Quantity: high to low</option>
        </select>
      </form>
      <p id="filter-error" class="error" role="alert" hidden></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th><th>Category</th><th class="num">Price</th><th class="num">Qty</th>
              <th class="num">Value</th><th>Status</th><th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>

      <div class="pager">
        <button id="prev">Previous</button>
        <span id="page-info" class="muted"></span>
        <button id="next">Next</button>
      </div>
    </section>

    <section id="low-stock" hidden>
      <div class="section-head"><h2>Low stock <span id="low-total" class="muted"></span></h2></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th><th>Supplier</th><th class="num">Qty</th><th class="num">Reorder at</th>
              <th class="num">Shortfall</th><th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="low-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="summary" hidden>
      <div class="section-head"><h2>Category summary</h2></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Category</th><th class="num">Products</th><th class="num">Quantity</th>
              <th class="num">Avg price</th><th class="num">Stock value</th>
            </tr>
          </thead>
          <tbody id="summary-rows"></tbody>
          <tfoot id="summary-total"></tfoot>
        </table>
      </div>
    </section>
  </main>

  <dialog id="product-dialog">
    <form id="product-form" novalidate>
      <h2 id="product-dialog-title">Add product</h2>
      <label class="wide">Name <input name="name" required maxlength="100"><small data-error="name"></small></label>
      <label>SKU <input name="sku" required placeholder="FURN-TB-812"><small data-error="sku"></small></label>
      <label>Category <select name="category" required></select><small data-error="category"></small></label>
      <label>Price (₹) <input name="price" type="number" min="0" step="any" required><small data-error="price"></small></label>
      <label>Quantity <input name="quantity" type="number" min="0" step="1" required><small data-error="quantity"></small></label>
      <label>Reorder level <input name="reorderLevel" type="number" min="0" step="1" value="10"><small data-error="reorderLevel"></small></label>
      <label>Supplier <input name="supplier" required maxlength="100"><small data-error="supplier"></small></label>
      <p class="error wide" data-form-error role="alert" hidden></p>
      <div class="dialog-actions wide">
        <button type="button" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="stock-dialog">
    <form id="stock-form" class="single" novalidate>
      <h2>Adjust stock</h2>
      <p id="stock-product" class="muted"></p>
      <fieldset class="segmented">
        <legend class="sr-only">Stock action</legend>
        <label><input type="radio" name="direction" value="1" checked> Restock</label>
        <label><input type="radio" name="direction" value="-1"> Sale</label>
      </fieldset>
      <label>Units <input name="units" type="number" min="1" step="1" required></label>
      <p class="error" data-form-error role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-close>Cancel</button>
        <button type="submit" class="primary">Update</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog">
    <form id="delete-form" class="single">
      <h2>Delete product?</h2>
      <p id="delete-product" class="muted"></p>
      <p class="error" data-form-error role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-close>Cancel</button>
        <button type="submit" class="danger">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
